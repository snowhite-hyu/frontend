name: Dev CI/CD

on:
  push:
    branches: [ "develop" ]

jobs:
  dev-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Docker update
        run: sudo apt-get update && sudo apt-get install docker-ce docker-ce-cli containerd.io

      - name: Docker Login
        run: echo "${{ secrets.GITLAB_PASSWORD }}" | docker login registry.ryuuga.duckdns.org -u "${{ secrets.GITLAB_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker buildx build --platform linux/arm64 -t localhost/snowhite/frontend:latest .

      - name: Tag Docker Image
        run: docker image tag localhost/snowhite/frontend:latest registry.ryuuga.duckdns.org/snowhite/frontend:latest

      - name: Push Docker Image
        run: docker push registry.ryuuga.duckdns.org/snowhite/frontend:latest

