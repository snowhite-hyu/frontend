name: Dev CI/CD

on:
  push:
    branches: [ "develop" ]

jobs:
  dev-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Docker update
        run: apt-get update && apt-get install docker-ce docker-ce-cli containerd.io

      - name: Docker Login
        run: echo "${{ secrets.GITLAB_PASSWORD }}" | docker login registry.ryuuga.duckdns.org -u "${{ secrets.GITLAB_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker buildx build --push --platform linux/arm64 -t registry.ryuuga.duckdns.org/snowhite/frontend:latest .
